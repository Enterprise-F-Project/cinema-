name: CI

on:
  push:
    branches: [main, "zeru-testing", "hlina-security-tests", "mistre-selenium"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend unit, validation, and security tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven tests (exclude Selenium E2E)
        working-directory: backend
        # CinemaSystemTest needs a live frontend on :3000 and Chrome.
        # Unit, Phase 6 validation, and Phase 4 security (Testcontainers) run here.
        run: mvn -B clean test -Dtest='!CinemaSystemTest'

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
